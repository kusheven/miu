
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>Pusheen AR</title>
  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.1.0/model-viewer.min.js">
  </script>
  <style>
    body { margin: 0; background: #FFD9E2; }
    model-viewer {
      width: 100vw;
      height: 100vh;
      background: #FFD9E2;
    }
  </style>
</head>
<body>
  <model-viewer
    src="./pusheen_vs_noodle.glb"
    alt="pusheen vs noodle"
    camera-controls
    autoplay
    ar
    ar-modes="scene-viewer webxr"
    shadow-intensity="0.56">

    <button slot="ar-button" style="
        position: absolute;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        padding: 15px 24px;
        border: none;
        border-radius: 12px;
        background: #FF6D83;
        color: white;
        font-size: 16px;
        font-weight: bold;
        z-index: 10;
        white-space: nowrap;
    ">
        Посмотреть в AR
    </button>

</model-viewer>
  <script>
  const model = document.querySelector('model-viewer');

  model.addEventListener('load', () => {
    const animations = model.availableAnimations;

    if (animations.length === 0) return;

    // Запускаем первую анимацию
    model.animationName = animations[0];
    model.play();

    // Добавляем остальные одновременно
    animations.slice(1).forEach(name => {
      model.appendAnimation(name, {
        weight: 1,
        timeScale: 1
      });
    });
  });
</script>
</body>
</html>
