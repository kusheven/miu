
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>Pusheen AR</title>
  <script async
  src="https://ga.jspm.io/npm:es-module-shims@1.7.1/dist/es-module-shims.js">
</script>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@^0.183.0/build/three.module.min.js"
  }
}
</script>

<script type="module"
  src="https://cdn.jsdelivr.net/npm/@google/model-viewer/dist/model-viewer-module.min.js">
</script>

<script type="module"
  src="https://cdn.jsdelivr.net/npm/@google/model-viewer-effects/dist/model-viewer-effects.min.js">
</script>
  <style>
    body { margin: 0; background: #FFD9E2; }
    model-viewer {
      width: 100vw;
      height: 100vh;
      background: #FFD9E2;
    }
  </style>
</head>
<body>
  <model-viewer
    src="./pusheen_vs_noodle.glb"
    ios-src="./pusheen_vs_noodle.usdz"
    alt="Котик Pusheen с раменом"
    camera-controls
    autoplay
    ar
    ar-modes="webxr scene-viewer quick-look"
    shadow-intensity="0.56">
    <effect-composer render-mode="quality">
  <bloom-effect
    strength="1.2"
    radius="0.6"
    threshold="0.5">
  </bloom-effect>
</effect-composer>
    <button slot="ar-button" id="ar-button"
      style="
        position: absolute;
        bottom: 15%;
        left: 50%;
        transform: translateX(-50%);
        padding: 16px 28px;
        border: none;
        border-radius: 14px;
        background: #FF6D83;
        color: white;
        font-size: 16px;
        font-weight: bold;
        z-index: 10;
      ">
      Посмотреть в AR
    </button>

</model-viewer>
  <script>
  const model = document.querySelector('model-viewer');

  model.addEventListener('load', () => {
    const animations = model.availableAnimations;

    if (animations.length === 0) return;

    // Запускаем первую анимацию
    model.animationName = animations[0];
    model.play();

    // Добавляем остальные одновременно
    animations.slice(1).forEach(name => {
      model.appendAnimation(name, {
        weight: 1,
        timeScale: 1
      });
    });
  });
</script>
</body>
</html>
