
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>Pusheen AR</title>
  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.1.0/model-viewer.min.js">
  </script>
  <style>
    body { margin: 0; background: #FFD9E2; }
    model-viewer {
      width: 100vw;
      height: 100vh;
      background: #FFD9E2;
    }
  </style>
</head>
<body>
  <model-viewer
    src="./pusheen_vs_noodle.glb"
    alt="pusheen vs noodle"
    camera-controls
    ar
    ar-modes="scene-viewer webxr"
    shadow-intensity="0.56">
  </model-viewer>
</body>
</html>
